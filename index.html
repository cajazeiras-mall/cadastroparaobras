<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastro para Construção Civil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --carvao:#23272B; --concreto:#E4E5E6; --papel:#F7F7F5; --amarelo:#FFC20E;
    --azul:#0F5C8C; --erro:#B3261E; --ok:#1E7B3A;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--concreto);color:var(--carvao);font-family:'Barlow',system-ui,sans-serif;font-size:17px;line-height:1.45}
  header{background:var(--carvao);color:#fff;padding:22px 20px 18px;border-bottom:8px solid var(--amarelo);text-align:center}
  header h1{margin:0;font-family:'Barlow Condensed',Impact,sans-serif;font-weight:700;font-size:2.1rem;line-height:1.05;letter-spacing:.2px}
  .contador{margin:10px 0 0;color:#cfd2d4;font-size:.98rem}
  .contador strong{color:var(--amarelo);font-size:1.15rem}
  main{max-width:560px;margin:0 auto;padding:18px 16px 40px}
  .recado{background:var(--amarelo);border-left:10px solid var(--carvao);padding:16px 16px 16px 18px;margin:0 0 20px;font-weight:600;font-size:1.12rem;line-height:1.35}
  form,.sucesso{background:var(--papel);padding:20px 18px;border:2px solid var(--carvao)}
  label{display:block;font-weight:600;margin:0 0 6px}
  .campo{margin-bottom:18px}
  .dica{display:block;font-weight:400;font-size:.9rem;color:#555;margin-top:2px}
  input,textarea{width:100%;font:inherit;padding:12px;border:2px solid #8b9095;border-radius:0;background:#fff;color:var(--carvao)}
  textarea{min-height:96px;resize:vertical}
  input:focus,textarea:focus,button:focus-visible,a.btn:focus-visible{outline:3px solid var(--azul);outline-offset:2px;border-color:var(--azul)}
  .invalido{border-color:var(--erro)}
  .msg-erro{color:var(--erro);font-weight:600;margin:0 0 14px;min-height:0}
  .msg-erro:empty{display:none}
  .btn{display:block;width:100%;text-align:center;text-decoration:none;font-family:'Barlow Condensed',Impact,sans-serif;font-weight:700;font-size:1.45rem;letter-spacing:.4px;padding:14px;border:0;cursor:pointer;background:var(--carvao);color:var(--amarelo)}
  .btn:disabled{opacity:.6;cursor:wait}
  .btn.zap{background:#128C4A;color:#fff;margin-top:16px}
  .sucesso h2{margin:0 0 8px;font-family:'Barlow Condensed',Impact,sans-serif;font-size:1.8rem;color:var(--ok)}
  .sucesso p{margin:0 0 10px}
  .oculto{display:none}
  @media (prefers-reduced-motion:no-preference){ .btn{transition:filter .15s} .btn:hover{filter:brightness(1.15)} }
</style>
</head>
<body>
<header>
  <h1>Cadastro para Construção Civil</h1>
  <p class="contador" id="contador" aria-live="polite"></p>
</header>

<main>
  <div class="recado" role="note">
    Não pedimos documentação. Apenas seus dados para entrarmos em contato sobre possíveis vagas.
  </div>

  <form id="form" novalidate>
    <div class="campo">
      <label for="nome">Nome</label>
      <input id="nome" name="nome" type="text" maxlength="80" autocomplete="name" required>
    </div>

    <div class="campo">
      <label for="whatsapp">WhatsApp
        <span class="dica">Somente profissionais de Fortaleza (DDD 85)</span>
      </label>
      <input id="whatsapp" name="whatsapp" type="tel" inputmode="numeric" placeholder="(85) 99999-9999" maxlength="15" autocomplete="tel" required>
    </div>

    <div class="campo">
      <label for="atividade">O que você faz?
        <span class="dica">Escreva tudo: pedreiro, eletricista, pintor…</span>
      </label>
      <textarea id="atividade" name="atividade" maxlength="300" required></textarea>
    </div>

    <div class="campo">
      <label for="sobre">Conte algo sobre você
        <span class="dica">Experiência, bairros onde atende, disponibilidade (opcional)</span>
      </label>
      <textarea id="sobre" name="sobre" maxlength="800"></textarea>
    </div>

    <p class="msg-erro" id="erro" role="alert"></p>
    <button class="btn" id="enviar" type="submit">Enviar cadastro</button>
  </form>

  <section class="sucesso oculto" id="sucesso" aria-live="polite">
    <h2>Cadastro salvo!</h2>
    <p>Falta só um passo: toque no botão abaixo e envie a mensagem no WhatsApp para confirmar seus dados.</p>
    <a class="btn zap" id="linkZap" href="#" target="_blank" rel="noopener">Enviar no WhatsApp</a>
  </section>
</main>

<script>
  var NUMERO_ADMIN = '5585996461047';
  var $ = function (id) { return document.getElementById(id); };

  // COLE AQUI o link do App da Web gerado pelo Apps Script (termina em /exec)
  var API_URL = 'https://script.google.com/macros/s/AKfycbyukACi_qu2m--gxOs88HHsV9Ns6zitQ2Fp8TrB8TaqfTiiPZ_Awkf9YL6F8Hyh0axfMQ/exec';

  function mostrarTotal(t) {
    $('contador').innerHTML = '<strong>' + t + '</strong> ' + (t === 1 ? 'profissional já se cadastrou' : 'profissionais já se cadastraram');
  }

  function enviarCadastro(d) {
    return fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(d)
    }).then(function (res) { return res.json(); });
  }

  // Contador de cadastrados
  fetch(API_URL)
    .then(function (res) { return res.json(); })
    .then(function (r) { if (r && r.ok) mostrarTotal(r.total); })
    .catch(function () {});

  // Máscara (85) 99999-9999
  $('whatsapp').addEventListener('input', function (e) {
    var d = e.target.value.replace(/\D/g, '');
    if (d.length > 11 && d.indexOf('55') === 0) d = d.substring(2);
    d = d.substring(0, 11);
    var s = d;
    if (d.length > 6) s = '(' + d.substring(0, 2) + ') ' + d.substring(2, 7) + '-' + d.substring(7);
    else if (d.length > 2) s = '(' + d.substring(0, 2) + ') ' + d.substring(2);
    else if (d.length > 0) s = '(' + d;
    e.target.value = s;
  });

  function mostrarErro(msg, campo) {
    $('erro').textContent = msg;
    ['nome', 'whatsapp', 'atividade'].forEach(function (c) { $(c).classList.remove('invalido'); });
    if (campo) { $(campo).classList.add('invalido'); $(campo).focus(); }
  }

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    mostrarErro('');

    var nome = $('nome').value.trim();
    var zap = $('whatsapp').value.replace(/\D/g, '');
    var atividade = $('atividade').value.trim();
    var sobre = $('sobre').value.trim();

    if (!nome) return mostrarErro('Informe seu nome.', 'nome');
    if (zap.length < 10) return mostrarErro('Informe o WhatsApp com DDD.', 'whatsapp');
    if (zap.substring(0, 2) !== '85') {
      return mostrarErro('O cadastro é somente para profissionais de Fortaleza (DDD 85).', 'whatsapp');
    }
    if (zap.length !== 11 || zap.charAt(2) !== '9') {
      return mostrarErro('Número de WhatsApp inválido. Use o formato (85) 9XXXX-XXXX.', 'whatsapp');
    }
    if (!atividade) return mostrarErro('Conte o que você faz (ex.: pedreiro, eletricista).', 'atividade');

    $('enviar').disabled = true;
    $('enviar').textContent = 'Enviando…';

    enviarCadastro({ nome: nome, whatsapp: zap, atividade: atividade, sobre: sobre })
      .then(function (r) {
        if (!r.ok) {
          $('enviar').disabled = false;
          $('enviar').textContent = 'Enviar cadastro';
          return mostrarErro(r.mensagem, /WhatsApp|DDD|número/i.test(r.mensagem) ? 'whatsapp' : null);
        }
        var d = r.dados;
        var texto = '*Novo cadastro - Construção Civil*\n' +
          'Nome: ' + d.nome + '\n' +
          'WhatsApp: ' + d.whatsapp + '\n' +
          'Atividade: ' + d.atividade + '\n' +
          'Sobre: ' + (d.sobre || '-');
        $('linkZap').href = 'https://wa.me/' + (r.admin || NUMERO_ADMIN) + '?text=' + encodeURIComponent(texto);
        mostrarTotal(r.total);
        $('form').classList.add('oculto');
        $('sucesso').classList.remove('oculto');
        $('sucesso').scrollIntoView();
      })
      .catch(function () {
        $('enviar').disabled = false;
        $('enviar').textContent = 'Enviar cadastro';
        mostrarErro('Não foi possível enviar agora. Verifique a internet e tente de novo.');
      });
  });
</script>
</body>
</html>
